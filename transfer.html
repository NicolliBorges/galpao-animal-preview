<!doctype html>
<meta charset="utf-8">
<title>transfer</title>
<body style="font:16px sans-serif;padding:20px">preparando imagens…
<script>
const W = 'https://wsrv.nl/?url=galpaoanimal.com.br/wp-content/uploads/';
const IM = {
  'fachada.webp': '2022/05/Banner-Novo-da-Fachada.png&cx=900&cy=0&cw=1595&ch=750&output=webp&q=80',
  'ararajuba.webp': '2022/04/ararajuba-menorzinho-1.jpg&cx=780&cy=0&cw=1715&ch=750&output=webp&q=80',
  'furao.webp': '2022/04/furao-menorzinho.jpg&cx=820&cy=0&cw=1675&ch=750&output=webp&q=78',
  'tartaruga.webp': '2022/04/tartaruga-menorzinho.jpg&cx=760&cy=0&cw=1735&ch=750&output=webp&q=78',
  'peixe-azul.webp': '2022/04/peixe-azul-scaled.jpg&w=1600&output=webp&q=78',
  'peixe-bolinha.webp': '2022/04/peixe-bolinha-1.jpeg&w=1024&output=webp&q=80',
  'tartarugas.webp': '2022/06/Tartaruga-nova.jpeg&w=827&output=webp&q=80',
  'racao.webp': '2022/04/Racao-Mega-Zoo-Papagaio-Frutas.png&w=600&output=webp&q=82',
  'logo.png': '2022/01/Logo-Verde-png.png&w=800&cx=96&cy=230&cw=626&ch=328&output=png'
};
(async () => {
  const files = [];
  for (const [name, q] of Object.entries(IM)) {
    const r = await fetch(W + q);
    const b = await r.blob();
    files.push({ name, type: b.type, blob: b });
  }
  if (window.opener) {
    window.opener.postMessage({ kind: 'galpao-files', files }, 'https://github.com');
    document.body.textContent = 'enviado: ' + files.length + ' imagens';
    setTimeout(() => window.close(), 1500);
  } else {
    document.body.textContent = 'sem janela de origem';
  }
})();
</script>
</body>
